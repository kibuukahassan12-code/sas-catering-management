{% extends "base.html" %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Admin · Departments</p>
        <h1>{{ action }} Department</h1>
    </div>
    <div>
        <a class="btn-secondary" href="{{ url_for('admin.departments_list') }}">← Back to Departments</a>
    </div>
</section>

<section class="panel">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="name">Department Name *</label>
            <input type="text" id="name" name="name" class="form-control" 
                   value="{{ department.name if department else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3">{{ department.description if department else '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="manager_id">Department Manager</label>
            <select id="manager_id" name="manager_id" class="form-control">
                <option value="">-- Select Manager --</option>
                {% for u in users %}
                <option value="{{ u.id }}" {% if department and department.manager_id == u.id %}selected{% endif %}>
                    {{ u.email }}
                </option>
                {% endfor %}
            </select>
            <small class="muted">The user who will manage this department</small>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn-primary">{{ 'Update Department' if action == 'Edit' else 'Create Department' }}</button>
            <a href="{{ url_for('admin.departments_list') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
